<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>About us</title>
</head>
<body>
    <center>
    <section>
        <img class="mySlides" src="pic1.jpg" style="height:800px; width: 1000px;">
        <img class="mySlides" src="pic2.jpg" style="height:800px; width: 1000px;">
        <img class="mySlides" src="pic3.jpg" style="height:800px; width: 1000px;">
        <img class="mySlides" src="pic4.jpg" style="height:800px; width: 1000px;">
        <img class="mySlides" src="pic5.jpg" style="height:800px; width: 1000px;">
        <img class="mySlides" src="pic6.jpg" style="height:800px; width: 1000px;">
    </section>
    </center>
    <script>
        var myIndex = 0;
        carousel();
        function carousel() {
            var i;
            var x = document.getElementsByClassName("mySlides");
            for (i = 0; i < x.length; i++) {
                x[i].style.display = "none";
            }
             myIndex++;
             if (myIndex > x.length) {myIndex = 1}
             x[myIndex-1].style.display = "block";
             setTimeout(carousel, 3000);
        }
    </script>
</body>
</html>
